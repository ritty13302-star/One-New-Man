<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f0">
<title>與主同行｜年度目標管理</title>
<style>
:root{--bg:#f7f6f0;--card:#fff;--ink:#25352b;--muted:#718075;--green:#607d65;--pale:#e5ece2;--line:#e5e8df;--gold:#d8b86a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.55}
.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:15px;background:var(--pale);display:grid;place-items:center;font-size:24px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 14px}p{margin:0}.year{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:#fff;font-weight:600}
.hero{background:#e8eee4;border-radius:24px;padding:24px;margin-bottom:18px;position:relative;overflow:hidden}.hero:after{content:"✳";position:absolute;right:22px;top:12px;font-size:64px;color:#c5d4c0;opacity:.75}.hero small{color:#5e7663}.hero h2{font-size:27px;margin:5px 0 14px;position:relative;z-index:1}.progressline{height:9px;background:#d0ddcd;border-radius:99px;overflow:hidden}.progressline span{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .2s}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 24px}.stat,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}.stat .ico{font-size:20px}.stat strong{display:block;font-size:25px;margin:4px 0 0}.muted{color:var(--muted);font-size:13px}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--green);color:white;font-weight:650;cursor:pointer;font-size:14px}.btn.secondary{background:var(--pale);color:var(--ink)}.btn.ghost{background:transparent;color:var(--muted);padding:7px}.goal-list{display:grid;gap:10px}.goal{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.goal-top{display:flex;gap:10px;align-items:flex-start}.goal-icon{font-size:21px}.goal-main{flex:1;min-width:0}.goal-title{font-weight:700}.goal-meta{font-size:12px;color:var(--muted);margin-top:3px}.goal-actions{display:flex;gap:6px;align-items:center}.mini{border:1px solid var(--line);background:white;border-radius:9px;padding:6px 9px;cursor:pointer;color:var(--ink)}.mini.done{background:var(--pale);border-color:#cbd9c8}.goalbar{height:6px;background:#edf0e9;border-radius:99px;margin-top:12px;overflow:hidden}.goalbar span{display:block;height:100%;background:#91aa8e;border-radius:99px}.two{display:grid;grid-template-columns:1.15fr .85fr;gap:14px;margin-top:18px}.book-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--line)}.book-row:last-child{border-bottom:0}.book-row input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;color:var(--ink);font:inherit;outline:none}.book-row input[type=number]{width:70px;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff;color:var(--ink);font:inherit}.book-row input[type=checkbox]{accent-color:var(--green);width:18px;height:18px}.book-row{flex-wrap:wrap}.book-label{font-size:11px;color:var(--muted)}.book-fields{display:flex;gap:6px;align-items:center;flex:1;min-width:220px}.book-delete{border:0;background:transparent;color:#8b6c65;padding:6px;cursor:pointer}.week textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical;font:inherit;background:#fff;color:var(--ink)}.week .btn{margin-top:9px}.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:16px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}.modal{position:fixed;inset:0;background:#1e2b2270;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.open{display:flex}.dialog{background:white;border-radius:20px;padding:22px;width:min(100%,440px);box-shadow:0 20px 70px #0002}.dialog label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}.dialog input,.dialog select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit;background:#fff;color:var(--ink)}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:620px){.wrap{padding:17px 12px 40px}.hero{padding:20px}.hero h2{font-size:23px}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:22px}.two{grid-template-columns:1fr}.top{align-items:flex-start}.year{font-size:12px}.goal-actions{flex-direction:column}.goal-actions .mini{font-size:12px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><div class="logo">🌱</div><div><div class="eyebrow">MY YEAR, ONE STEP AT A TIME</div><h1>與主同行</h1><div class="muted">在每一天的行動中與主同行</div></div></div>
    <div class="year">2026 年</div>
  </header>
  <section class="hero">
    <small>我的年度旅程</small>
    <h2>今天也向前一步。</h2>
    <div style="display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font-size:13px"><span>年度目標完成率</span><strong id="totalText">0%</strong></div>
    <div class="progressline"><span id="totalBar"></span></div>
  </section>
  <section class="stats">
    <div class="stat"><div class="ico">🎯</div><strong id="activeCount">0</strong><div class="muted">進行中目標</div></div>
    <div class="stat"><div class="ico">🌿</div><strong id="doneCount">0</strong><div class="muted">已完成目標</div></div>
    <div class="stat"><div class="ico">📚</div><strong id="bookCount">0/0</strong><div class="muted">完成書報</div></div>
  </section>
  <section>
    <div class="sectionhead"><h2>我的年度目標</h2><button class="btn" id="addBtn">＋ 新增目標</button></div>
    <div class="goal-list" id="goalList"></div>
  </section>
  <section class="two">
    <div class="panel">
      <div class="sectionhead"><h2>📚 書報閱讀紀錄</h2><button class="btn secondary" id="addBookBtn">＋ 新增書報</button></div>
      <div class="muted" id="bookProgress" style="margin-bottom:8px">已完成 0 本</div>
      <div id="books"></div>
      <p class="notice">可新增書報名稱、總章數，並記錄已讀章數；資料會自動儲存。</p>
    </div>
    <div class="panel week">
      <h2>🗓️ 本週回顧</h2>
      <p class="muted" style="margin-bottom:10px">這週做了什麼？下週想往哪裡前進？</p>
      <label for="weekNote">本週記錄</label>
      <textarea id="weekNote" placeholder="例如：完成兩次讀書進度、關心一位朋友……"></textarea>
      <label for="nextWeek">下週想做的事</label>
      <textarea id="nextWeek" style="min-height:85px" placeholder="寫下下一步的小行動"></textarea>
      <button class="btn" id="saveWeek">儲存本週紀錄</button>
      <div id="savedMsg" class="notice" aria-live="polite"></div>
    </div>
  </section>
  <div class="footer">你的資料目前只儲存在這個瀏覽器中。建議定期匯出備份。</div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="dialog">
    <h2 id="modalTitle">新增年度目標</h2>
    <label for="goalName">目標名稱</label><input id="goalName" maxlength="100" placeholder="例如：每週禱研背講">
    <label for="goalCategory">分類</label><select id="goalCategory"><option>生活</option><option>閱讀</option><option>學習</option><option>服事</option><option>健康</option><option>其他</option></select>
    <label for="goalTarget">目標數量（沒有數量目標可填 1）</label><input id="goalTarget" type="number" min="1" max="100000" value="1">
    <div class="dialog-actions"><button class="btn secondary" id="cancelBtn">取消</button><button class="btn" id="createBtn">新增</button></div>
    <div class="notice">例如「讀完十本書報」可設定數量 10，之後用 +1 記錄進度。</div>
  </div>
</div>
<script>
const KEY='with-the-lord-v1';
const starterGoals=[
 {id:1,name:'帶 30 位北科大女同學信而受浸得救成為姊妹',category:'服事',target:30,current:0},
 {id:2,name:'讀完十本書報',category:'閱讀',target:10,current:0},
 {id:3,name:'每位姊妹都有可牧養的對象',category:'服事',target:1,current:0},
 {id:4,name:'鳥瞰帖撒羅尼迦前後書和腓利門書',category:'學習',target:1,current:0},
 {id:5,name:'有 15 位姊妹參加期末特會',category:'服事',target:15,current:0},
 {id:6,name:'週週禱研背講',category:'學習',target:52,current:0}
];
const starterBooks=Array.from({length:10},(_,i)=>({id:i+1,name:'',chapters:0,read:0,done:false}));
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||null}catch(e){state=null}
if(!state)state={goals:starterGoals,books:starterBooks,weekNote:'',nextWeek:''};
if(!Array.isArray(state.books))state.books=starterBooks;
state.books=state.books.map((b,i)=>({id:b.id||i+1,name:b.name||'',chapters:Number(b.chapters)||0,read:Number(b.read)||0,done:!!b.done}));
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('瀏覽器儲存空間無法使用，請確認瀏覽器允許網站儲存資料。')}}
function pct(g){return Math.min(100,Math.round((g.current/Math.max(1,g.target))*100))}
function renderGoals(){
 const el=$('goalList');
 if(!state.goals.length){el.innerHTML='<div class="empty">還沒有目標，按「新增目標」開始吧！</div>'}
 else el.innerHTML=state.goals.map(g=>`<article class="goal"><div class="goal-top"><div class="goal-icon">${g.category==='閱讀'?'📚':g.category==='服事'?'🤝':g.category==='健康'?'🌿':g.category==='學習'?'✍️':'🎯'}</div><div class="goal-main"><div class="goal-title">${esc(g.name)}</div><div class="goal-meta">${esc(g.category)} · ${g.current>=g.target?'已達成':`進度 ${g.current} / ${g.target}`}</div></div><div class="goal-actions"><button class="mini" data-act="minus" data-id="${g.id}" aria-label="減少進度">−</button><button class="mini" data-act="plus" data-id="${g.id}" aria-label="增加進度">＋1</button><button class="mini" data-act="delete" data-id="${g.id}" aria-label="刪除目標">刪除</button></div></div><div class="goalbar"><span style="width:${pct(g)}%"></span></div></article>`).join('');
 const total=state.goals.length?Math.round(state.goals.reduce((s,g)=>s+pct(g),0)/state.goals.length):0;
 $('totalText').textContent=total+'%';$('totalBar').style.width=total+'%';
 $('activeCount').textContent=state.goals.filter(g=>g.current<g.target).length;
 $('doneCount').textContent=state.goals.filter(g=>g.current>=g.target).length;
}
function renderBooks(){
 $('books').innerHTML=state.books.length?state.books.map((b,i)=>`<div class="book-row">
   <span class="muted">${String(i+1).padStart(2,'0')}</span>
   <div class="book-fields">
     <input type="text" data-bookname="${i}" value="${esc(b.name)}" placeholder="輸入書名或書報名稱" aria-label="第 ${i+1} 本書報名稱">
     <label><span class="book-label">總章數</span><input type="number" min="0" max="9999" data-bookchapters="${i}" value="${b.chapters||''}" placeholder="章" aria-label="總章數"></label>
     <label><span class="book-label">已讀</span><input type="number" min="0" max="${Math.max(0,b.chapters||9999)}" data-bookread="${i}" value="${b.read||''}" placeholder="章" aria-label="已讀章數"></label>
   </div>
   <input type="checkbox" data-bookcheck="${i}" ${b.done?'checked':''} aria-label="第 ${i+1} 本完成" title="整本完成">
   <button class="book-delete" data-bookdelete="${i}" aria-label="刪除書報" title="刪除">刪除</button>
 </div>`).join(''):'<div class="empty">還沒有書報，按「新增書報」開始記錄。</div>';
 const n=state.books.filter(b=>b.done).length;
 $('bookCount').textContent=n+'/'+state.books.length;
 $('bookProgress').textContent=`已完成 ${n} 本，共 ${state.books.length} 本`;
}
function render(){renderGoals();renderBooks();$('weekNote').value=state.weekNote||'';$('nextWeek').value=state.nextWeek||''}
$('goalList').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const g=state.goals.find(x=>x.id===Number(b.dataset.id));if(!g)return;if(b.dataset.act==='plus')g.current=Math.min(g.target,g.current+1);if(b.dataset.act==='minus')g.current=Math.max(0,g.current-1);if(b.dataset.act==='delete'&&confirm('確定刪除此目標？'))state.goals=state.goals.filter(x=>x.id!==g.id);persist();renderGoals()});
$('books').addEventListener('change',e=>{
 if(e.target.dataset.bookcheck!==undefined){state.books[Number(e.target.dataset.bookcheck)].done=e.target.checked;persist();renderBooks()}
 if(e.target.dataset.bookchapters!==undefined){const i=Number(e.target.dataset.bookchapters);state.books[i].chapters=Math.max(0,Math.floor(Number(e.target.value)||0));state.books[i].read=Math.min(state.books[i].read,state.books[i].chapters||state.books[i].read);persist();renderBooks()}
 if(e.target.dataset.bookread!==undefined){const i=Number(e.target.dataset.bookread);state.books[i].read=Math.max(0,Math.floor(Number(e.target.value)||0));if(state.books[i].chapters>0)state.books[i].read=Math.min(state.books[i].read,state.books[i].chapters);if(state.books[i].chapters>0&&state.books[i].read>=state.books[i].chapters)state.books[i].done=true;persist();renderBooks()}
});
$('books').addEventListener('input',e=>{if(e.target.dataset.bookname!==undefined){state.books[Number(e.target.dataset.bookname)].name=e.target.value;persist()}});
$('books').addEventListener('click',e=>{const b=e.target.closest('button[data-bookdelete]');if(!b)return;const i=Number(b.dataset.bookdelete);if(confirm('確定刪除這筆書報紀錄？')){state.books.splice(i,1);persist();renderBooks()}});
$('addBookBtn').onclick=()=>{state.books.push({id:Date.now(),name:'',chapters:0,read:0,done:false});persist();renderBooks();const inputs=$('books').querySelectorAll('input[data-bookname]');inputs[inputs.length-1]?.focus()};
$('addBtn').onclick=()=>{$('goalName').value='';$('goalTarget').value='1';$('modal').classList.add('open');$('goalName').focus()};
$('cancelBtn').onclick=()=> $('modal').classList.remove('open');
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))$('modal').classList.remove('open')});
$('createBtn').onclick=()=>{const name=$('goalName').value.trim(),target=Math.floor(Number($('goalTarget').value));if(!name){alert('請輸入目標名稱');return}if(!Number.isFinite(target)||target<1){alert('目標數量至少為 1');return}state.goals.push({id:Date.now(),name,category:$('goalCategory').value,target,current:0});persist();renderGoals();$('modal').classList.remove('open')};
$('saveWeek').onclick=()=>{state.weekNote=$('weekNote').value;state.nextWeek=$('nextWeek').value;persist();$('savedMsg').textContent='已儲存 ✓';setTimeout(()=>{$('savedMsg').textContent=''},2200)};
render();
</script>
</body>
</html>
